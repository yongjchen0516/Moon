<html lang="zh-Hant" data-theme="rila">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F1E8DB">
<title>Moon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/rila-180.png">
<link rel="icon" type="image/png" href="icons/rila-192.png">

<style>
:root{
  --bg:#E8EBE9;--card:#F8F8F5;--ink:#1F2733;--sub:#5A6472;--line:#D5DAD8;
  --acc:#3C4E9C;--acc-ink:#F5F6FC;--acc-soft:rgba(60,78,156,.10);
  --good:#3F7A66;--good-soft:rgba(74,133,112,.15);--good-ring:#5A9A84;
  --warn:#8F6620;--warn-soft:rgba(185,138,54,.17);--warn-ring:#CBA045;
  --bad:#A94643;--bad-soft:rgba(178,82,79,.13);
  --hero:#2A3566;--hero-ink:#EEF0FA;--hero-sub:rgba(238,240,250,.72);--hero-btn:#F3F4FA;--hero-btn-ink:#2A3566;
  --sh:0 1px 2px rgba(31,39,51,.05),0 16px 32px -20px rgba(31,39,80,.38);
  --sh-s:0 1px 2px rgba(31,39,51,.08);
  --shade:rgba(20,24,40,.38);
  --serif:"Noto Serif TC","Source Han Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU","Noto Serif SC","Source Han Serif SC","Noto Serif CJK SC","Songti SC","SimSun",ui-serif,Georgia,serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#11141B;--card:#1A1E28;--ink:#E3E6EE;--sub:#8F96A6;--line:#2A303D;
  --acc:#9DAAF0;--acc-ink:#12162A;--acc-soft:rgba(157,170,240,.14);
  --good:#86C2AA;--good-soft:rgba(125,187,162,.16);--good-ring:#6FAF96;
  --warn:#D8B06A;--warn-soft:rgba(212,174,102,.16);--warn-ring:#C9A25A;
  --bad:#E0908C;--bad-soft:rgba(217,138,134,.16);
  --hero:#222B52;--hero-ink:#E8EBFA;--hero-sub:rgba(232,235,250,.68);--hero-btn:#E8EBFA;--hero-btn-ink:#1B2347;
  --sh:0 1px 0 rgba(255,255,255,.03) inset,0 18px 34px -22px rgba(0,0,0,.85);
  --sh-s:0 1px 2px rgba(0,0,0,.4);
  --shade:rgba(0,0,0,.55);
}}

/* theme: rila (warm brown, cream, honey) */
:root[data-theme="rila"]{
  --bg:#F1E8DB;--card:#FBF6EE;--ink:#4A3426;--sub:#75604E;--line:#E3D6C4;
  --acc:#8F6040;--acc-ink:#FFF8EE;--acc-soft:rgba(143,96,64,.12);--tab:#E0B23F;
  --good:#4F7C4A;--good-soft:rgba(111,150,95,.18);--good-ring:#7FA36F;
  --warn:#8A6414;--warn-soft:rgba(224,178,63,.22);--warn-ring:#E0B23F;
  --bad:#B04F4A;--bad-soft:rgba(206,108,100,.15);
  --hero:#5A3E2E;--hero-ink:#FFF3E2;--hero-sub:rgba(255,243,226,.74);--hero-btn:#FBE7B4;--hero-btn-ink:#5A3E2E;
  --sh:0 1px 2px rgba(74,52,38,.06),0 16px 32px -20px rgba(90,62,46,.40);
  --sh-s:0 1px 2px rgba(74,52,38,.10);
  --shade:rgba(50,34,24,.42);
}
@media (prefers-color-scheme:dark){:root[data-theme="rila"]{
  --bg:#1F1813;--card:#2B221B;--ink:#F1E3D0;--sub:#B6A28E;--line:#3C3027;
  --acc:#D9A77B;--acc-ink:#2A1B10;--acc-soft:rgba(217,167,123,.16);--tab:#E0B23F;
  --good:#A9C792;--good-soft:rgba(141,176,122,.18);--good-ring:#8DB07A;
  --warn:#E8C26A;--warn-soft:rgba(224,178,63,.18);--warn-ring:#D9AE4A;
  --bad:#E59A90;--bad-soft:rgba(229,154,144,.16);
  --hero:#3A2A1F;--hero-ink:#FBEBD6;--hero-sub:rgba(251,235,214,.70);--hero-btn:#F2D9AE;--hero-btn-ink:#3A2A1F;
  --sh:0 1px 0 rgba(255,255,255,.03) inset,0 18px 34px -22px rgba(0,0,0,.85);
  --sh-s:0 1px 2px rgba(0,0,0,.4);
  --shade:rgba(0,0,0,.55);
}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 var(--sans);-webkit-font-smoothing:antialiased}
#app{max-width:680px;margin:0 auto;padding:0 18px calc(48px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
textarea,input[type=text],input[type=file],select{font:inherit;color:inherit;width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
select{min-height:50px}
textarea{min-height:110px;resize:vertical;line-height:1.6}
input[type=file]{padding:10px 12px;font-size:15px}
svg.ic{flex:none;display:block}

/* type */
h1{font:600 28px/1.25 var(--serif);letter-spacing:.04em;margin:0}

h1.logo{display:flex;align-items:center;gap:8px;font:400 30px/1 "MoonLogo",var(--serif);letter-spacing:.01em;margin:0}
h1.logo svg{width:24px;height:24px;flex:none;color:var(--acc,currentColor);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--acc,currentColor) 45%,transparent))}
h1.logo i{font-style:normal;position:relative;top:-1px}
h2{font:600 18px/1.4 var(--sans);margin:28px 0 10px}
.serif{font-family:var(--serif)}
.sub{color:var(--sub);font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* layout */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:20px 0 14px}
.row{display:flex;gap:8px;align-items:center}
.center{text-align:center}
.card{background:var(--card);border-radius:20px;padding:18px;margin:14px 0;box-shadow:var(--sh)}
label.f{display:block;font-size:14px;color:var(--sub);margin:14px 0 6px}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:0 22px;border-radius:16px;background:var(--acc);color:var(--acc-ink);font-weight:600;letter-spacing:.03em}
.btn[disabled]{opacity:.4}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 15px;border-radius:21px;background:var(--card);box-shadow:var(--sh-s);font-size:15px;white-space:nowrap}
.pill.icon{padding:0;width:42px;justify-content:center}
@media(max-width:400px){.top .row{gap:5px}.top .pill.icon{width:38px;min-height:38px}.top .pill{padding:0 11px;min-height:38px}h1.logo{gap:5px;font-size:28px}}
.pill.on-warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger,.danger{color:var(--bad)}
.pill.flat{background:transparent;box-shadow:none;color:var(--sub)}
.chip{min-height:44px;padding:0 18px;border-radius:22px;background:var(--card);box-shadow:var(--sh-s)}
.chip.on{background:var(--acc-soft);color:var(--acc);font-weight:600}

/* home */
.warn{background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:12px 16px;margin:4px 0 14px;font-size:15px}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:26px;padding:24px 22px 20px;margin:6px 0 22px;box-shadow:var(--sh)}
.hero-row{display:flex;align-items:baseline;gap:10px}
.hero .n{font:600 60px/1 var(--serif);font-variant-numeric:lining-nums tabular-nums}
.hero .cap{font-size:17px;color:var(--hero-sub)}
.hero .done-t{font:600 26px/1.4 var(--serif);letter-spacing:.03em}
.hero .stats{margin:12px 0 18px;color:var(--hero-sub)}
.hero .stats b{color:var(--hero-ink)}
.hero .btn{background:var(--hero-btn);color:var(--hero-btn-ink)}
.hero .go{display:flex;gap:10px;align-items:center}
.hero .go .more{flex:none;min-height:54px;padding:0 6px;color:var(--hero-sub);font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:14px;color:var(--sub)}
.stats b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.deck{display:flex;align-items:center;gap:2px;margin:12px 0}
.deck .pill.icon{width:40px}
.deck-main{flex:1;min-width:0;display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--sh)}
.deck-main .name{font:600 18px/1.4 var(--serif);letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deck-main .info{flex:1;min-width:0}
.deck-main .stats{margin-top:2px}
.ring{position:relative;flex:none;width:48px;height:48px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .rb{stroke:var(--line)}.ring .rl{stroke:var(--warn-ring)}.ring .rm{stroke:var(--good-ring)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:600 12px var(--sans);color:var(--sub);font-variant-numeric:tabular-nums}
.grp{display:flex;align-items:center;gap:2px;margin:20px 0 4px}
.grp-h{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:44px;text-align:left;padding:0 4px}
.grp-h .chev{display:grid;place-items:center;color:var(--sub);transition:transform .2s}
.grp-h .chev.open{transform:rotate(90deg)}
.grp-h .gname{font:600 17px/1.3 var(--serif);letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-h .gmeta{margin-left:auto;font-size:13px;color:var(--sub);white-space:nowrap;padding-left:8px}
.grp-body{margin-left:12px;padding-left:10px;border-left:2px solid var(--line)}
.grp-body .deck{margin:8px 0}
.grp-empty{font-size:14px;color:var(--sub);margin:8px 0 12px}
.glabel{font-size:13px;color:var(--sub);margin:20px 4px 2px;letter-spacing:.04em}
.deck-main.pk .chk-c{margin-right:0}
.deck-main.pk.on{box-shadow:0 0 0 2px var(--acc),var(--sh)}
.grp-h .chk-c{margin-right:0}
.grp-h.on .chk-c{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.legend{display:flex;justify-content:center;gap:18px;font-size:13px;color:var(--sub);margin-top:22px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

/* sheet & modal */
.overlay{position:fixed;inset:0;background:var(--shade);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .2s ease-out}
.sheet{width:100%;max-width:680px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:12px 18px calc(24px + env(safe-area-inset-bottom));animation:rise .28s cubic-bezier(.2,.8,.25,1)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2.t{font:600 22px/1.4 var(--serif);margin:0 0 4px;letter-spacing:.03em}
.opts{background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden;margin:6px 0 18px}
.rowopt{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:0 16px;text-align:left}
.rowopt+.rowopt{border-top:1px solid var(--line)}
.rowopt .dot{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent}
.rowopt.on .dot{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.rowopt .t{flex:1}
.rowopt .c{color:var(--sub);font-variant-numeric:tabular-nums}
.rowopt.on .t{font-weight:600}
.seg{display:flex;gap:4px;padding:4px;background:var(--acc-soft);border-radius:16px;margin:6px 0 18px}
.seg button{flex:1;min-height:44px;border-radius:12px}
.seg button.on{background:var(--card);box-shadow:var(--sh-s);font-weight:600}
@keyframes fade{from{opacity:0}to{opacity:1}}

<body>
<div id="app"></div>
<div id="toast" class="toast" role="status"></div>
<script>
"use strict";
const KEY = 'review-cards-v1';
const RATE_LABELS = ['不會', '模糊', '記得', '很熟'];
const PROMPT = `請根據我附上的筆記照片，產生複習用題目卡片。
只輸出一個 JSON 代碼塊，不要有其他說明文字，格式如下：
{"decks":[{"name":"牌組名稱","cards":[{"q":"問題","a":"簡短答案","wrong":["干擾1","干擾2","干擾3"],"note":"補充說明"}]}]}
規則：
- 每張卡只問一個概念，答案盡量簡短（一句話以內）
- wrong 的干擾選項要和正確答案同類型、看起來合理但明確錯誤
- 照片看不清楚的地方不要猜，請跳過
- 不要編造照片中沒有的內容`;

const PROMPT_VOCAB = `請根據我附上的單詞清單或筆記照片，產生外語單字卡。
只輸出一個 JSON 代碼塊，不要有其他說明文字，格式如下：
{"decks":[{"name":"牌組名稱","type":"vocab","cards":[{"q":"單字（日文請写漢字或原文写法）","rd":"讀音（假名；沒有漢字時可留空）","a":"簡短中文意思","wrong":["相似單字的意思1","意思2","意思3"],"note":"例句\\n例句翻譯"}]}]}
規則：
- 一張卡一個單字；a 只写最常用的 1～2 個意思，使用繁體中文（台灣用語）
- wrong 要選字形、讀音或意思容易混淆的其他單字的中文意思
- 例句要簡單自然，並附翻譯
- 看不清楚的單字不要猜，請跳過`;

let store = { decks: [], groups: [], collapsed: {}, tomb: {}, settings: { filter: 'due', mode: 'flip', count: 20, theme: 'indigo' } };
let storageOK = true;
let route = { name: 'home' };
let sheet = null;   // {scope, filter, mode, count}
let modal = null;   // {did, cid}
let S = null;       // study session
let sel = null;     // deck select mode {ids:Set}
let moveSheet = null;
let pick = null;      // Set of deck ids when choosing decks to review
let grpSheet = null;   // {g}
let deckGrpSheet = null; // {did}
let dlg = null;
let listQuery = '', listFilter = 'all';

/* ---------- icons ---------- */
const ICONS = {
  plus: '<path d="M12 5v14M5 12h14"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  save: '<path d="M12 4v11M7.5 11L12 15.5 16.5 11M5 20h14"/>',
  star: '<path d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/>',
  pencil: '<path d="M4.5 19.5l.9-3.9L16.3 4.7a2 2 0 012.9 2.9L8.3 18.6l-3.8.9z"/>',
  check: '<path d="M5.5 12.5l4.2 4.2L18.5 8"/>',
  list: '<path d="M8.5 6.5H20M8.5 12H20M8.5 17.5H20"/><path d="M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01" stroke-width="2.6"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  speaker: '<path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4 4 0 010 6"/><path d="M18 6.5a7.5 7.5 0 010 11"/>',
  more: '<path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/>',
  palette: '<path d="M12 3.5a8.5 8.5 0 100 17c1.2 0 1.8-.8 1.8-1.7 0-.6-.3-1-.6-1.4-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a3.5 3.5 0 003.5-3.5C20.5 7 16.8 3.5 12 3.5z"/><path d="M7.5 11h.01M10 7.5h.01M14.5 7.5h.01" stroke-width="2.4"/>'
};
function ic(n, fill) { return `<svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="${fill ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`; }

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const key = q => String(q).toLowerCase().replace(/\s+/g, '');
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let toastTimer;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 1800); }
function copyText(t) {
  const fallback = () => { const x = document.createElement('textarea'); x.value = t; x.style.position = 'fixed'; x.style.opacity = '0'; document.body.appendChild(x); x.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} x.remove(); toast(ok ? '已複制' : '複制失敗，請手動選取'); };
  try { navigator.clipboard.writeText(t).then(() => toast('已複制'), fallback); } catch (e) { fallback(); }
}

/* ---------- storage ---------- */
function load() {
  try {
    localStorage.setItem(KEY + '_t', '1'); localStorage.removeItem(KEY + '_t');
    const s = localStorage.getItem(KEY);
    if (s) { const o = JSON.parse(s); if (o && Array.isArray(o.decks)) { store.decks = o.decks; store.groups = Array.isArray(o.groups) ? o.groups.filter(g => typeof g === 'string' && g) : []; store.collapsed = (o.collapsed && typeof o.collapsed === 'object') ? o.collapsed : {}; store.tomb = (o.tomb && typeof o.tomb === 'object') ? o.tomb : {}; store.settings = Object.assign(store.settings, o.settings || {}); } }
  } catch (e) { storageOK = false; }
  syncGroups(); seedHashes();
}
function save() {
  stamp();
  if (!storageOK) return;
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { storageOK = false; render(); }
}

/* ---------- data helpers ---------- */
function syncGroups() {
  store.groups = [...new Set(store.groups)];
  for (const d of store.decks) { if (d.group) { if (!store.groups.includes(d.group)) store.groups.push(d.group); } else delete d.group; }
}
const dname = d => d.group ? d.group + ' › ' + d.name : d.name;
const isG = sc => typeof sc === 'string' && sc.startsWith('g:');
const isM = sc => typeof sc === 'string' && sc.startsWith('m:');
const deck = id => store.decks.find(d => d.id === id);
function find(did, cid) { const d = deck(did); if (!d) return null; const c = d.cards.find(x => x.id === cid); return c ? { d, c } : null; }
const isDue = c => !c.seen || c.due <= Date.now();
function status(c) { if (!c.seen) return 'new'; if (c.interval >= 21) return 'mastered'; return 'learning'; }
function poolFor(scope) { const out = []; for (const d of store.decks) if (scope === 'all' || d.id === scope || (isG(scope) && d.group === scope.slice(2)) || (isM(scope) && scope.slice(2).split(',').includes(d.id))) for (const c of d.cards) out.push({ d, c }); return out; }
function match(c, f) { if (f === 'known') return !!c.known; if (c.known) return false; if (f === 'due') return isDue(c); if (f === 'weak') return c.weak; if (f === 'wrong') return c.inWrong; return true; }
function counts(scope) { const p = poolFor(scope), a = p.filter(x => !x.c.known); return { total: p.length, known: p.length - a.length, due: a.filter(x => isDue(x.c)).length, fresh: a.filter(x => !x.c.seen).length, weak: a.filter(x => x.c.weak).length, wrong: a.filter(x => x.c.inWrong).length, mastered: p.filter(x => x.c.known || status(x.c) === 'mastered').length, learning: a.filter(x => status(x.c) === 'learning').length }; }

function normCard(c) {
  if (!c || typeof c !== 'object') return null;
  const q = String(c.q ?? c.question ?? c.front ?? '').trim();
  const a = String(c.a ?? c.answer ?? c.back ?? '').trim();
  if (!q || !a) return null;
  let wrong = c.wrong ?? c.distractors ?? [];
  if (typeof wrong === 'string') wrong = wrong.split('\n');
  wrong = Array.isArray(wrong) ? wrong.map(x => String(x).trim()).filter(x => x && x !== a) : [];
  const n = (v, d) => (v !== null && v !== undefined && v !== '' && Number.isFinite(+v)) ? +v : d;
  return { id: c.id || uid(), rd: String(c.rd ?? c.reading ?? c.kana ?? '').trim(), q, a, wrong: [...new Set(wrong)], note: String(c.note ?? '').trim(), weak: !!c.weak, inWrong: !!c.inWrong, known: !!c.known, streak: n(c.streak, 0), ease: n(c.ease, 2.3), interval: n(c.interval, 0), due: n(c.due, 0), seen: !!c.seen, reps: n(c.reps, 0), lastAt: n(c.lastAt, 0) };
}
function parseJSON(text) {
  let t = text.trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
  try { return JSON.parse(t); } catch (e) {}
  const i = t.search(/[\[{]/), j = Math.max(t.lastIndexOf('}'), t.lastIndexOf(']'));
  if (i >= 0 && j > i) { try { return JSON.parse(t.slice(i, j + 1)); } catch (e) {} }
  throw new Error('讀不出 JSON。請確認粘貼的是完整內容（從 { 到 }），沒有被截斷。');
}
function toDecks(obj, fallback) {
  let decks;
  if (Array.isArray(obj)) decks = (obj.length && obj[0] && obj[0].cards) ? obj : [{ name: fallback, cards: obj }];
  else if (obj && Array.isArray(obj.decks)) decks = obj.decks;
  else if (obj && Array.isArray(obj.cards)) decks = [obj];
  else throw new Error('找不到 decks 或 cards 字段。');
  return decks.map(d => ({ id: d.id, type: d.type === 'vocab' ? 'vocab' : '', group: d.group ? String(d.group).trim() : '', name: String(d.name || fallback || '未命名牌組').trim(), cards: (Array.isArray(d.cards) ? d.cards : []).map(normCard).filter(Boolean) }));
}
function mergeDecks(decks) {
  let added = 0, skipped = 0, newDecks = 0;
  for (const d of decks) {
    let t = store.decks.find(x => x.name === d.name);
    if (!t) { t = { id: uid(), name: d.name, cards: [] }; if (d.group) t.group = d.group; if (d.type) t.type = d.type; store.decks.push(t); newDecks++; }
    const keys = new Set(t.cards.map(c => key(c.q)));
    for (const c of d.cards) { const k = key(c.q); if (keys.has(k)) { skipped++; continue; } keys.add(k); t.cards.push(c); added++; }
  }
  syncGroups(); save();
  return { added, skipped, newDecks };
}

/* ---------- spaced repetition ---------- */
function rate(c, r) {
  const now = Date.now();
  c.seen = true; c.lastAt = now;
  let ease = c.ease || 2.3, iv = c.interval || 0;
  if (r === 0) {
    ease = Math.max(1.3, ease - 0.2); iv = 0; c.reps = 0; c.due = now + 10 * 60000; c.streak = 0; c.inWrong = true;
  } else {
    c.reps = (c.reps || 0) + 1;
    if (r === 1) { iv = Math.max(1, Math.round(Math.max(iv, 1) * 1.2)); ease = Math.max(1.3, ease - 0.15); }
    else if (r === 2) { iv = c.reps <= 1 ? 1 : c.reps === 2 ? 3 : Math.max(1, Math.round(iv * ease)); }
    else { iv = c.reps <= 1 ? 3 : Math.max(2, Math.round(Math.max(iv, 1) * ease * 1.3)); ease += 0.15; }
    c.due = now + iv * 86400000;
    c.streak = (c.streak || 0) + 1;
    if (c.inWrong && c.streak >= 2) c.inWrong = false;
  }
  c.ease = ease; c.interval = iv;
}
function lbl(iv, r) { if (r === 0) return '10 分'; if (iv < 30) return iv + ' 天'; return Math.round(iv / 30) + ' 月'; }
function preview(c, r) { const t = Object.assign({}, c); rate(t, r); return lbl(t.interval, r); }

/* ---------- session ---------- */
function buildQueue(scope, f, n, order) {
  let p = poolFor(scope).filter(x => match(x.c, f));
  const g = x => x.c.weak ? 0 : x.c.inWrong ? 1 : x.c.seen ? 2 : 3;
  if (order !== 'seq') { p = shuffle(p); p.sort((a, b) => g(a) - g(b)); }
  if (n > 0) p = p.slice(0, n);
  return p.map(x => ({ did: x.d.id, cid: x.c.id }));
}
function startSession(cfg) {
  const queue = buildQueue(cfg.scope, cfg.filter, cfg.count, cfg.mode === 'browse' ? (cfg.order || 'seq') : 'rand');
  if (!queue.length) { toast('沒有符合的卡片'); return; }
  S = { cfg, queue, idx: 0, stats: [0, 0, 0, 0], requeued: new Set(), flipped: false, picked: null, opts: null, easy: false, anim: true };
  Object.assign(store.settings, { filter: cfg.filter === 'known' ? store.settings.filter : cfg.filter, mode: cfg.mode === 'browse' ? store.settings.mode : cfg.mode, count: cfg.count, dir: (deck(cfg.scope) && deck(cfg.scope).type === 'vocab') ? (store.settings.dir || 'f') : (cfg.dir || 'f'), tts: cfg.tts || 'auto' }); save();
  enter();
  go('study');
}
function enter() {
  while (S.queue[S.idx]) { const f0 = find(S.queue[S.idx].did, S.queue[S.idx].cid); if (f0 && (S.cfg.filter === 'known' || !f0.c.known)) break; S.idx++; }
  S.flipped = false; S.picked = null; S.opts = null; S.easy = false; S.anim = true;
  S.rev = S.cfg.dir === 'r' || (S.cfg.dir === 'x' && S.cfg.mode !== 'browse' && Math.random() < 0.5);
  const it = S.queue[S.idx];
  if (it && S.cfg.mode === 'mcq') { const f = find(it.did, it.cid); S.opts = makeOptions(it.did, f.c, S.rev); }

function sheetRefresh() {   // update the settings sheet in place: no re-animation, scroll position kept
  const old = document.querySelector('.overlay .sheet');
  if (!old || !sheet) return render();
  const tmp = document.createElement('div'); tmp.innerHTML = sheetHTML();
  const nw = tmp.querySelector('.sheet'), st = old.scrollTop;
  old.innerHTML = nw.innerHTML; old.scrollTop = st;
}
function render() {
  let h;
  switch (route.name) {
    case 'study': h = S ? viewStudy() : viewHome(); break;
    case 'deck': h = viewDeck(); break;
    case 'import': h = viewImport(); break;
    case 'backup': h = viewBackup(); break;
    default: h = viewHome();
  }
  if (sheet && route.name === 'home') h += sheetHTML();
  if (modal) h += modalHTML();
  if (moveSheet && route.name === 'deck') h += moveHTML();
  if (grpSheet && route.name === 'home') h += grpSheetHTML();
  if (deckGrpSheet && route.name === 'deck') h += deckGrpHTML();
  if (dlg) h += dlgHTML();

}

/* ---------- in-page dialogs (no native prompt/confirm) ---------- */

  }

const THEMES = ['indigo', 'rila', 'milk'];

}
let tx = null, ty = null;

  if (Math.abs(dx) > 60 && Math.abs(dy) < 50) {
    if (dx < 0 && S.idx >= S.queue.length - 1) return;
    const b = document.querySelector('[data-act=bgo][data-d="' + (dx < 0 ? 1 : -1) + '"]'); if (b && !b.disabled) b.click();
  }
}, { passive: true });
load();
applyTheme();
render();
</script>
